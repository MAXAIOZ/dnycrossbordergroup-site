<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none" role="img" aria-label="DNY Cross Border Group">
  <!-- Background pill -->
  <rect x="0" y="4" width="48" height="44" rx="12" fill="url(#logoGrad)"/>

  <!-- D letterform -->
  <path d="M10 14 h8 a10 10 0 0 1 0 20 h-8 Z" stroke="#0a1525" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  <!-- N letterform -->
  <path d="M24 34 V14 l10 20 V14" stroke="#0a1525" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dot accent — echoes dotted texture motif -->
  <circle cx="40" cy="14" r="3" fill="#0a1525" opacity="0.65"/>
  <circle cx="40" cy="24" r="2" fill="#0a1525" opacity="0.4"/>
  <circle cx="40" cy="32" r="1.4" fill="#0a1525" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="58" y="25" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="17" fill="#F2D58C" letter-spacing="-0.5">DNY</text>
  <text x="58" y="41" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#AEB8C8" letter-spacing="0.5">Cross Border Group</text>

  <defs>
    <linearGradient id="logoGrad" x1="0" y1="4" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8B77A"/>
      <stop offset="100%" stop-color="#B96F2C"/>
    </linearGradient>
  </defs>
</svg>
