<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none" role="img" aria-label="DNY Cross Border Group">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16253E"/>
      <stop offset="100%" stop-color="#0C1825"/>
    </linearGradient>
    <linearGradient id="arcG" x1="11" y1="17" x2="43" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8912A"/>
      <stop offset="100%" stop-color="#E8C060"/>
    </linearGradient>
    <clipPath id="bc">
      <rect width="54" height="54" rx="11"/>
    </clipPath>
  </defs>

  <!-- Badge background -->
  <rect width="54" height="54" rx="11" fill="url(#bgG)"/>

  <g clip-path="url(#bc)">
    <!-- Globe outline ellipse -->
    <ellipse cx="27" cy="17" rx="16" ry="11" stroke="#C8912A" stroke-width="1.2" fill="none" opacity="0.4"/>
    <!-- Equator -->
    <line x1="11" y1="17" x2="43" y2="17" stroke="#C8912A" stroke-width="0.8" opacity="0.22"/>
    <!-- Central meridian -->
    <line x1="27" y1="6" x2="27" y2="28" stroke="#C8912A" stroke-width="0.8" opacity="0.22"/>
    <!-- Cross-border arc (top arc, highlighted) -->
    <path d="M11 17 Q27 5 43 17" stroke="url(#arcG)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Connection nodes (two cities / markets) -->
    <circle cx="11" cy="17" r="3" fill="#D4A030"/>
    <circle cx="43" cy="17" r="3" fill="#D4A030"/>
    <!-- Apex node -->
    <circle cx="27" cy="5.5" r="1.8" fill="#E8C060" opacity="0.7"/>
    <!-- Subtle divider -->
    <line x1="7" y1="32" x2="47" y2="32" stroke="#C8912A" stroke-width="0.5" opacity="0.18"/>
    <!-- Gold bottom accent bar -->
    <rect y="50" width="54" height="4" fill="#C8912A" opacity="0.65"/>
  </g>

  <!-- DNY monogram in badge -->
  <text x="27" y="46"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-weight="800" font-size="11.5" fill="#F0D888"
        text-anchor="middle" letter-spacing="3">DNY</text>

  <!-- Thin separator between badge and wordmark -->
  <line x1="62" y1="9" x2="62" y2="45" stroke="#C8912A" stroke-width="0.8" opacity="0.22"/>

  <!-- Wordmark: "DNY" -->
  <text x="70" y="28"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-weight="800" font-size="19" fill="#F2D58C" letter-spacing="-0.4">DNY</text>

  <!-- Wordmark: subtitle -->
  <text x="70" y="44"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-weight="500" font-size="10.5" fill="#8AAABB" letter-spacing="1.3">Cross Border Group</text>
</svg>
